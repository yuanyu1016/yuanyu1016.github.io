<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Yuanyu 的个人网站">
    <title>Yuanyu | Personal Website</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --text: #1f2933;
        --muted: #5f6c7b;
        --accent: #0f766e;
        --line: #d9d2c3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(120deg, rgba(15, 118, 110, 0.12), transparent 34%),
          linear-gradient(300deg, rgba(180, 83, 9, 0.12), transparent 30%),
          var(--bg);
      }

      main {
        width: min(920px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-content: center;
        gap: 32px;
        padding: 56px 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(42px, 8vw, 84px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .intro {
        max-width: 680px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: clamp(18px, 2.4vw, 22px);
        line-height: 1.65;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.55);
        text-decoration: none;
        font-weight: 650;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      footer {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-label="Intro">
        <p class="eyebrow">yuanyu1016.github.io</p>
        <h1>你好，我是 Yuanyu。</h1>
        <p class="intro">
          这是我的个人网站。目前它用于验证 GitHub Pages 部署，后续会逐步放入项目、文章和个人介绍。
        </p>
        <div class="links">
          <a class="button primary" href="https://github.com/yuanyu1016">GitHub</a>
          <a class="button" href="https://github.com/yuanyu1016/yuanyu1016.github.io">网站仓库</a>
        </div>
      </section>
      <footer>
        <span>Built with GitHub Pages.</span>
      </footer>
    </main>
  </body>
</html>
