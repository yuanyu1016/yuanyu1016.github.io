<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --hyy-paper: #faf9f5;
    --hyy-paper-soft: #f1eee6;
    --hyy-paper-deep: #e5dfd2;
    --hyy-ink: #36342f;
    --hyy-muted: #716d64;
    --hyy-faint: #a8a196;
    --hyy-line: rgba(54, 52, 47, 0.18);
    --hyy-line-strong: rgba(54, 52, 47, 0.34);
    --hyy-accent: #7a3f2b;
    --hyy-frame-x: clamp(1.5rem, 5vw, 4.75rem);
    --hyy-frame-y: clamp(1.25rem, 4.6vw, 4.5rem);
    --hyy-prose: min(100%, 46rem);
    --hyy-wide: min(100%, 58rem);
    --hyy-ui: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --hyy-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  }

  html {
    background: var(--hyy-paper);
    scroll-behavior: smooth;
  }

  body {
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      linear-gradient(rgba(250, 249, 245, 0.94), rgba(250, 249, 245, 0.94)),
      radial-gradient(circle at 18% 16%, rgba(122, 63, 43, 0.08), transparent 28rem),
      radial-gradient(circle at 82% 74%, rgba(54, 52, 47, 0.06), transparent 30rem),
      var(--hyy-paper);
    color: var(--hyy-ink);
    font-family: var(--hyy-serif);
    font-size: 16px;
    letter-spacing: 0;
  }

  body::before {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.18;
    background-image:
      linear-gradient(rgba(54, 52, 47, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(54, 52, 47, 0.06) 1px, transparent 1px);
    background-size: 34px 34px, 34px 34px;
    mask-image: radial-gradient(ellipse 70% 80% at 50% 48%, #000 0%, transparent 76%);
  }

  body::after {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  ::selection {
    background: rgba(122, 63, 43, 0.18);
  }

  .masthead,
  .page__footer {
    position: relative;
    z-index: 5;
    border: 0;
    background: transparent;
  }

  .masthead {
    padding: var(--hyy-frame-y) var(--hyy-frame-x) 0;
  }

  .masthead__inner-wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .greedy-nav {
    min-height: auto;
    background: transparent;
  }

  .greedy-nav .site-title {
    color: var(--hyy-ink);
    font-family: var(--hyy-ui);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.25;
    text-decoration: none;
    text-transform: uppercase;
  }

  .greedy-nav .visible-links {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
  }

  .greedy-nav .visible-links a,
  .greedy-nav .hidden-links a,
  .greedy-nav__toggle {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.25;
    text-transform: uppercase;
    transition: color 180ms ease;
  }

  .greedy-nav .visible-links a {
    padding: 0;
  }

  .greedy-nav .visible-links a::before {
    display: none;
  }

  .greedy-nav a:hover,
  .greedy-nav a:focus-visible,
  .greedy-nav .visible-links a:hover,
  .greedy-nav .visible-links a:focus-visible {
    color: var(--hyy-ink);
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
  }

  .greedy-nav__toggle {
    background: transparent;
  }

  .greedy-nav .hidden-links {
    border: 1px solid var(--hyy-line);
    border-radius: 4px;
    background: rgba(250, 249, 245, 0.96);
    box-shadow: none;
  }

  .initial-content,
  .page,
  .archive {
    position: relative;
    z-index: 2;
  }

  .page {
    float: none;
    width: 100%;
    padding: 0 var(--hyy-frame-x);
  }

  .page__inner-wrap,
  .page__content {
    float: none;
    max-width: none;
  }

  .page__title,
  .page__meta,
  .sidebar,
  .breadcrumbs {
    display: none;
  }

  .page__content {
    color: var(--hyy-ink);
  }

  .hyy-site {
    box-sizing: border-box;
    width: 100%;
    min-height: calc(100dvh - 8rem);
    padding: clamp(4.5rem, 10vw, 8.5rem) 0 clamp(5rem, 10vw, 8rem);
  }

  .hyy-site :is(h1, h2, h3, p, ul, ol) {
    margin-top: 0;
  }

  .hyy-home {
    position: relative;
    isolation: isolate;
    display: grid;
    align-content: center;
    gap: clamp(4.5rem, 9vw, 8rem);
  }

  .hyy-home--wave {
    min-height: calc(100dvh - 7rem);
  }

  .hyy-wave-canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100vw;
    height: 100dvh;
    pointer-events: none;
    opacity: 0.72;
  }

  .hyy-home-hero,
  .hyy-section,
  .hyy-doc {
    width: var(--hyy-prose);
    margin-inline: auto;
  }

  .hyy-home-hero {
    min-height: min(62dvh, 42rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .hyy-kicker,
  .hyy-meta,
  .hyy-row-meta,
  .hyy-label,
  .hyy-footer-kicker {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.45;
    text-transform: uppercase;
  }

  .hyy-kicker {
    margin-bottom: 1.1rem;
  }

  .hyy-home h1,
  .hyy-doc h1 {
    color: var(--hyy-ink);
    font-family: var(--hyy-serif);
    font-size: clamp(2rem, 4.6vw, 4.2rem);
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.12;
    text-wrap: balance;
  }

  .hyy-home h1 {
    margin-bottom: 1.6rem;
  }

  .hyy-home-note,
  .hyy-lede,
  .hyy-letter p,
  .hyy-entry p,
  .hyy-simple-list p {
    color: var(--hyy-ink);
    font-size: clamp(1.05rem, 1rem + 0.35vw, 1.22rem);
    font-weight: 400;
    line-height: 1.9;
    text-wrap: pretty;
  }

  .hyy-home-note,
  .hyy-lede {
    max-width: 41rem;
    margin-inline: auto;
    color: var(--hyy-muted);
  }

  .hyy-home-links,
  .hyy-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.8rem 1.1rem;
    margin-top: 2rem;
  }

  .hyy-link,
  .hyy-actions a,
  .hyy-entry a,
  .hyy-letter a,
  .hyy-index-row {
    color: inherit;
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
    transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
  }

  .hyy-link:hover,
  .hyy-actions a:hover,
  .hyy-entry a:hover,
  .hyy-letter a:hover,
  .hyy-index-row:hover {
    color: var(--hyy-accent);
    text-decoration-style: solid;
  }

  .hyy-home-index,
  .hyy-entry-list,
  .hyy-simple-list {
    width: var(--hyy-wide);
    margin-inline: auto;
    border-top: 1px solid var(--hyy-line-strong);
  }

  .hyy-index-row,
  .hyy-entry,
  .hyy-simple-list article {
    display: grid;
    grid-template-columns: minmax(8.5rem, 13rem) minmax(0, 1fr);
    gap: clamp(1.25rem, 4vw, 3.2rem);
    padding: clamp(1.25rem, 3.2vw, 2rem) 0;
    border-bottom: 1px solid var(--hyy-line);
    text-decoration: none;
  }

  .hyy-index-row h2,
  .hyy-entry h2,
  .hyy-entry h3,
  .hyy-simple-list h2,
  .hyy-simple-list h3 {
    margin-bottom: 0.45rem;
    color: var(--hyy-ink);
    font-family: var(--hyy-serif);
    font-size: clamp(1.2rem, 1.6vw, 1.55rem);
    font-style: italic;
    font-weight: 500;
    line-height: 1.25;
    text-wrap: balance;
  }

  .hyy-index-row p,
  .hyy-entry p,
  .hyy-simple-list p {
    margin-bottom: 0;
    color: var(--hyy-muted);
    font-size: 1rem;
    line-height: 1.75;
  }

  .hyy-doc {
    padding-top: clamp(1rem, 2vw, 2rem);
  }

  .hyy-doc-header {
    margin-bottom: clamp(3rem, 7vw, 5.5rem);
    text-align: center;
  }

  .hyy-doc h1 {
    margin-bottom: 1.2rem;
  }

  .hyy-letter {
    width: var(--hyy-prose);
    margin: 0 auto;
  }

  .hyy-letter p {
    margin-bottom: 1.35rem;
  }

  .hyy-letter em,
  .hyy-section-title {
    color: var(--hyy-ink);
    font-style: italic;
    font-weight: 600;
  }

  .hyy-rule {
    width: var(--hyy-prose);
    height: 1px;
    margin: clamp(3rem, 7vw, 5rem) auto;
    background: var(--hyy-line-strong);
  }

  .hyy-pair {
    display: grid;
    grid-template-columns: minmax(8.5rem, 13rem) minmax(0, 1fr);
    gap: clamp(1.25rem, 4vw, 3.2rem);
    width: var(--hyy-wide);
    margin: 0 auto clamp(3rem, 7vw, 5rem);
  }

  .hyy-pair .hyy-letter {
    width: auto;
  }

  .hyy-tagline {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    line-height: 1.7;
    text-transform: uppercase;
  }

  .hyy-footnote {
    width: var(--hyy-prose);
    margin: clamp(3rem, 7vw, 5rem) auto 0;
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    line-height: 1.7;
  }

  .hyy-social-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    width: var(--hyy-wide);
    margin-inline: auto;
    border: 1px solid var(--hyy-line);
    background: var(--hyy-line);
  }

  .hyy-social-grid a,
  .hyy-social-grid div {
    min-height: 9rem;
    padding: clamp(1.2rem, 3vw, 1.8rem);
    background: rgba(250, 249, 245, 0.82);
    color: inherit;
    text-decoration: none;
  }

  .hyy-social-grid strong {
    display: block;
    margin-bottom: 0.65rem;
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .hyy-social-grid span {
    color: var(--hyy-muted);
    line-height: 1.7;
  }

  .hyy-social-grid a:hover {
    background: rgba(241, 238, 230, 0.88);
    color: var(--hyy-accent);
  }

  .page__footer {
    padding: 0 var(--hyy-frame-x) var(--hyy-frame-y);
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.78rem;
    line-height: 1.6;
  }

  .page__footer footer {
    margin-top: 0;
  }

  .page__footer-follow,
  .page__footer-copyright {
    width: var(--hyy-wide);
    max-width: 100%;
    margin-inline: auto;
    color: var(--hyy-muted);
    text-align: left;
  }

  .page__footer a {
    color: inherit;
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
  }

  .page__footer a:hover {
    color: var(--hyy-accent);
    text-decoration-style: solid;
  }

  :focus-visible {
    outline: 2px solid rgba(122, 63, 43, 0.55);
    outline-offset: 3px;
  }

  @media (max-width: 900px) {
    .masthead {
      padding-top: 1.25rem;
    }

    .greedy-nav .visible-links {
      gap: 0.65rem;
    }

    .hyy-site {
      padding-top: 4.5rem;
    }

    .hyy-home-hero {
      min-height: auto;
      text-align: left;
    }

    .hyy-home--wave .hyy-home-hero {
      min-height: min(58dvh, 34rem);
    }

    .hyy-wave-canvas {
      opacity: 0.58;
    }

    .hyy-home-note,
    .hyy-lede {
      margin-inline: 0;
    }

    .hyy-home-links,
    .hyy-actions {
      justify-content: flex-start;
    }

    .hyy-doc-header {
      text-align: left;
    }
  }

  @media (max-width: 680px) {
    .hyy-index-row,
    .hyy-entry,
    .hyy-simple-list article,
    .hyy-pair {
      grid-template-columns: 1fr;
      gap: 0.55rem;
    }

    .hyy-row-meta,
    .hyy-meta,
    .hyy-tagline {
      font-size: 0.76rem;
    }

    .hyy-social-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
