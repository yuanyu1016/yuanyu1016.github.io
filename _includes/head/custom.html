<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --hyy-paper: #faf9f5;
    --hyy-paper-soft: #f1eee6;
    --hyy-paper-deep: #e5dfd2;
    --hyy-ink: #36342f;
    --hyy-muted: #716d64;
    --hyy-faint: #a8a196;
    --hyy-line: rgba(54, 52, 47, 0.18);
    --hyy-line-strong: rgba(54, 52, 47, 0.34);
    --hyy-accent: #7a3f2b;
    --hyy-frame-x: clamp(1.5rem, 5vw, 4.75rem);
    --hyy-frame-y: clamp(1.25rem, 4.6vw, 4.5rem);
    --hyy-nav-space: clamp(5rem, 7vw, 6rem);
    --hyy-prose: min(100%, 46rem);
    --hyy-wide: min(100%, 58rem);
    --hyy-ui: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --hyy-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  }

  html {
    background: var(--hyy-paper);
    color: var(--hyy-ink);
    font-family: var(--hyy-serif);
    font-size: 16px;
    letter-spacing: 0;
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      linear-gradient(rgba(250, 249, 245, 0.94), rgba(250, 249, 245, 0.94)),
      radial-gradient(circle at 18% 16%, rgba(122, 63, 43, 0.08), transparent 28rem),
      var(--hyy-paper);
    color: var(--hyy-ink);
    font-family: var(--hyy-serif);
    font-size: 16px;
    letter-spacing: 0;
  }

  body::before {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.16;
    background-image:
      linear-gradient(rgba(54, 52, 47, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(54, 52, 47, 0.06) 1px, transparent 1px);
    background-size: 34px 34px, 34px 34px;
    mask-image: radial-gradient(ellipse 70% 80% at 50% 48%, #000 0%, transparent 76%);
  }

  body::after {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    content: "";
    opacity: 0.11;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  ::selection {
    background: rgba(122, 63, 43, 0.18);
  }

  html.hyy-fullpage-active,
  html:has([data-hyy-fullpage]) {
    scroll-snap-type: y proximity;
  }

  html.hyy-fullpage-active body,
  body:has([data-hyy-fullpage]) {
    overscroll-behavior-y: contain;
  }

  html.hyy-fullpage-active .page__footer,
  body:has([data-hyy-fullpage]) .page__footer {
    display: none;
  }

  .masthead,
  .page__footer {
    position: relative;
    z-index: 5;
    border: 0;
    background: transparent;
  }

  .masthead {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 20;
    box-sizing: border-box;
    width: 100%;
    padding: clamp(1rem, 2.2vw, 1.5rem) var(--hyy-frame-x) clamp(0.85rem, 1.8vw, 1.15rem);
    background:
      linear-gradient(rgba(250, 249, 245, 0.94), rgba(250, 249, 245, 0.86)),
      var(--hyy-paper);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .masthead__inner-wrap {
    width: 100%;
    max-width: none;
    padding: 0;
  }

  .greedy-nav {
    min-height: auto;
    background: transparent;
  }

  .greedy-nav .site-title {
    color: var(--hyy-ink);
    font-family: var(--hyy-ui);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.25;
    text-decoration: none;
    text-transform: uppercase;
  }

  .greedy-nav .visible-links {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
  }

  .greedy-nav .visible-links a,
  .greedy-nav .hidden-links a,
  .greedy-nav__toggle {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.25;
    text-transform: uppercase;
    transition: color 180ms ease;
  }

  .greedy-nav .visible-links a {
    padding: 0;
  }

  .greedy-nav .visible-links a::before {
    display: none;
  }

  .greedy-nav a:hover,
  .greedy-nav a:focus-visible,
  .greedy-nav .visible-links a:hover,
  .greedy-nav .visible-links a:focus-visible {
    color: var(--hyy-ink);
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
  }

  .greedy-nav__toggle {
    background: transparent;
  }

  .greedy-nav .hidden-links {
    border: 1px solid var(--hyy-line);
    border-radius: 4px;
    background: rgba(250, 249, 245, 0.96);
    box-shadow: none;
  }

  .initial-content,
  .page,
  .archive {
    position: relative;
    z-index: 2;
  }

  .page {
    float: none;
    width: 100%;
    padding: 0 var(--hyy-frame-x);
  }

  .page__inner-wrap,
  .page__content {
    float: none;
    max-width: none;
  }

  .page__title,
  .page__meta,
  .sidebar,
  .breadcrumbs {
    display: none;
  }

  .page__content {
    color: var(--hyy-ink);
    transition: opacity 210ms ease;
  }

  .hyy-page-exit,
  .hyy-page-enter {
    opacity: 0;
  }

  .hyy-pjax-loading {
    cursor: progress;
  }

  .hyy-pjax-loading .page__content {
    pointer-events: none;
    will-change: opacity;
  }

  .hyy-site {
    box-sizing: border-box;
    width: 100%;
    min-height: calc(100dvh - 8rem);
    padding: clamp(5rem, 10vw, 8rem) 0 clamp(5rem, 10vw, 8rem);
  }

  .hyy-site :is(h1, h2, h3, p, ul, ol) {
    margin-top: 0;
  }

  .hyy-home {
    position: relative;
    isolation: isolate;
    display: grid;
    align-content: center;
    gap: clamp(4.5rem, 9vw, 8rem);
  }

  .hyy-home--wave {
    min-height: calc(100dvh - 7rem);
  }

  .hyy-home--fullpage {
    display: block;
    gap: 0;
    min-height: auto;
    padding: 0;
  }

  .hyy-home--fullpage .hyy-fullpage-panel {
    box-sizing: border-box;
    height: 100dvh;
    min-height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;

  .hyy-wave-canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100vw;
    height: 100dvh;
    pointer-events: none;
    opacity: 0.72;
  }

  .hyy-home-hero,
  .hyy-section,
  .hyy-doc {
    width: var(--hyy-prose);
    margin-inline: auto;
  }

  .hyy-resume {
    width: var(--hyy-wide);
    margin-inline: auto;
  }

  .hyy-home-hero {
    min-height: min(62dvh, 42rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .hyy-home--fullpage .hyy-home-hero {
    min-height: 100dvh;
    padding: var(--hyy-nav-space) 0 clamp(2.75rem, 7vw, 5rem);

  .hyy-home--fullpage .hyy-home-index {
    display: flex;
    padding: var(--hyy-nav-space) 0 clamp(1.25rem, 3.5vw, 2.75rem);

    justify-content: center;
    border-top: 0;

  .hyy-home--fullpage .hyy-index-row {

  .hyy-home--fullpage .hyy-index-row h2 {

    line-height: 1.58;
  }

  .hyy-kicker,
  .hyy-meta,
  .hyy-row-meta,
  .hyy-label,
  .hyy-footer-kicker {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);

    line-height: 1.1;

  .hyy-actions a,
  .hyy-entry a,
  .hyy-letter a,
  .hyy-index-row {

  .hyy-actions a:hover,
  .hyy-entry a:hover,
  .hyy-letter a:hover,
  .hyy-index-row:hover {

  .hyy-simple-list {

    border-bottom: 1px solid var(--hyy-line);

  .hyy-simple-list h2,

    font-weight: 500;
    line-height: 1.28;

    font-size: 1rem;

    margin-bottom: clamp(3rem, 7vw, 5.5rem);
    text-align: center;
  }

  .hyy-doc h1 {
    margin-bottom: 1.2rem;
  }

  .hyy-resume li {
    line-height: 1.72;
    text-wrap: pretty;
  }

  .hyy-resume .hero {
    width: var(--hyy-prose);
    margin: 0 auto clamp(4rem, 8vw, 6rem);
    text-align: center;
  }

  .hyy-resume .eyebrow,
  .hyy-resume .meta,
  .hyy-resume .label {
    color: var(--hyy-muted);
    font-family: var(--hyy-ui);
    font-size: 0.82rem;
    font-weight: 500;
    line-height: 1.45;
    text-transform: uppercase;
  }

  .hyy-resume .hero h1 {

    font-family: var(--hyy-serif);

    font-style: italic;
    font-weight: 500;
    letter-spacing: 0;

    flex-wrap: wrap;
    justify-content: center;
    gap: 0.8rem 1.1rem;
    margin-top: 2rem;
  }

  .hyy-resume a {
    color: inherit;
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
    transition: color 180ms ease;
  }

  .hyy-resume a:hover {
    color: var(--hyy-accent);
    text-decoration-style: solid;
  }

  .hyy-resume .contact {

    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    margin: 0 auto clamp(4rem, 8vw, 6rem);

  }

  .hyy-resume .contact span {

    padding: 1.15rem 1.25rem;
    background: rgba(250, 249, 245, 0.84);

  }

  .hyy-resume .contact strong {

    font-size: 1rem;
    line-height: 1.65;

  .hyy-resume .section {
    display: grid;
    grid-template-columns: minmax(8.5rem, 13rem) minmax(0, 1fr);
    gap: clamp(1.25rem, 4vw, 3.2rem);
    padding: clamp(1.5rem, 3.4vw, 2.2rem) 0;

    font-weight: 500;
    line-height: 1.28;

    padding-bottom: 1.75rem;

  .hyy-resume .publication-meta {

    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .hyy-resume .mini {
    margin-bottom: 1.35rem;
  }

  .hyy-resume .mini:last-child {
    margin-bottom: 0;
  }

    color: var(--hyy-muted);

    line-height: 1.7;
    text-align: center;
  }

  }

  .hyy-section-title {

    font-style: italic;
    font-weight: 600;
  }

  .hyy-footnote {

    height: 1px;

    border: 0;
  }

    margin-bottom: clamp(2.25rem, 6vw, 4.5rem);

    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.16em;
  }

  .hyy-posts-action {
    width: var(--hyy-prose);
    margin: 1.8rem auto 0;
    font-family: var(--hyy-ui);
    font-size: 0.82rem;

    text-decoration-style: dotted;
